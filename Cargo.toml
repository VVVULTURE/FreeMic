[package]
name = "freemic"
version = "0.2.0"
edition = "2024"
description = "Soundboard + virtual microphone that mixes your real microphone with sound effects"
license = "MIT"
authors = ["Vaden"]
repository = "https://github.com/VVVULTURE/FreeMic"
default-run = "freemic"

[dependencies]
eframe = { version = "0.37", default-features = false, features = ["glow", "default_fonts", "x11", "wayland"] }
symphonia = { version = "0.6", default-features = false, features = ["mp3", "aac", "isomp4", "flac", "vorbis", "ogg", "wav", "pcm", "alac", "adpcm"] }
rubato = "5"
rtrb = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rfd = "0.17"
global-hotkey = "0.9"
log = "0.4"
ureq = { version = "3.5", default-features = false, features = ["rustls"] }
sha2 = "0.11"

[target.'cfg(windows)'.dependencies]
wasapi = "0.26"
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_System_Threading", "Win32_UI_Shell", "Win32_System_Registry", "Win32_Media_Audio", "Win32_Storage_FileSystem", "Win32_System_Pipes", "Win32_Security", "Win32_System_IO", "Win32_System_Console"] }

[target.'cfg(target_os = "linux")'.dependencies]
libpulse-binding = "2.30"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
panic = "unwind"

[lib]
name = "freemic"
path = "src/lib.rs"

[[bin]]
name = "freemic"
path = "src/main.rs"

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"
